<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osep_math 學生操作教學｜臆測五階段</title>
<style>
  :root{
    --bg:#fdf8ef; --ink:#2b2d42; --muted:#6b6f80; --card:#ffffff;
    --shade:#f4a261; --shade2:#e76f51; --ok:#2a9d8f; --bad:#d62828; --warn:#e9c46a;
    --s1:#4cc9f0; --s2:#f72585; --s3:#7209b7; --s4:#3a86ff; --s5:#2a9d8f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:10px 16px 4px;text-align:center}
  header h1{margin:4px 0 0;font-size:1.45rem}
  .home{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:12px;background:#e9e6df;color:var(--ink);font-weight:700;text-decoration:none}
  .home:focus-visible{outline:3px solid var(--s4);outline-offset:2px}
  /* 站點地圖 */
  .map{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px}
  .station{border:3px solid #ccc;background:#fff;border-radius:999px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;font-weight:700;color:#8a8d99;cursor:pointer;transition:all .35s;font-size:.98rem}
  .station.done{color:var(--ink);border-color:#aaa}
  .station.active{color:#fff;transform:scale(1.08);box-shadow:0 4px 10px rgba(0,0,0,.18);background:var(--c);border-color:var(--c)}
  .arrow{color:#bbb;font-weight:700}
  /* 舞台 */
  main{max-width:980px;margin:0 auto;padding:0 14px}
  .stage{background:var(--card);border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.08);min-height:380px;padding:18px 20px;position:relative;overflow:hidden}
  .stage-title{font-size:1.3rem;font-weight:800;margin:0 0 4px}
  .stage-sub{color:var(--muted);margin:0 0 12px}
  .caption{margin-top:14px;background:#fff7e0;border-left:6px solid var(--warn);border-radius:10px;padding:12px 16px;font-size:1.1rem;line-height:1.75;min-height:64px}
  .caption b{color:var(--shade2)}
  .controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:14px 0 6px}
  button{font:inherit;font-size:1.05rem;border:none;border-radius:12px;padding:10px 18px;min-height:44px;cursor:pointer;background:var(--ink);color:#fff}
  button.ghost{background:#e9e6df;color:var(--ink)}
  button:disabled{opacity:.35;cursor:default}
  button:focus-visible,.station:focus-visible{outline:3px solid var(--s4);outline-offset:2px}
  .progress{color:var(--muted);font-size:.95rem;min-width:90px;text-align:center}
  .bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;max-width:980px;margin:6px auto 0}
  .bar>i{display:block;height:100%;background:var(--shade);width:0;transition:width .4s}
  footer{text-align:center;color:var(--muted);font-size:.85rem;padding:14px}
  footer a{color:inherit;font-weight:700}

  /* 編輯器示意圖 */
  .ed{display:block;width:100%;height:auto;margin:0 auto;background:#f3f1ea;border-radius:12px;border:1px solid #e3ddd0}
  .ed text,.mini text{font-family:inherit}
  .mini{display:block;width:100%;height:auto;max-width:300px;margin:6px auto 0;background:#f3f1ea;border-radius:10px;border:1px solid #e3ddd0}
  .cards{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
  .cards>div{flex:1;min-width:240px;border-radius:14px;padding:10px 12px;background:#fff;border:2px solid #eee;line-height:1.6}
  .cards .okc{border-color:#bfe9df;background:#eefaf7}
  .cards .badc{border-color:#f3c4c4;background:#fff3f3}
  .cards h4{margin:0 0 2px;font-size:1.05rem}
  .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
  .legend div{display:flex;gap:8px;align-items:flex-start;line-height:1.5;font-size:1rem}
  .legend i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center}
  .tag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:.9rem;font-weight:700;color:#fff;margin-right:6px}
  .chat{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .chat div{max-width:88%;border-radius:14px;padding:8px 12px;line-height:1.6}
  .chat .me{align-self:flex-end;background:#dbe8ff}
  .chat .tutor{align-self:flex-start;background:#f1e3fb}
  .optbar{margin-top:12px;background:#f1efe8;border:2px dashed #b9b4a4;border-radius:10px;padding:10px 12px;line-height:1.6}
  .tl{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .tl .row{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:10px;background:#faf7f0}
  .tl .row b{flex:none;color:#fff;border-radius:8px;padding:3px 10px;min-width:98px;text-align:center}
  .tl .link{color:var(--muted);font-size:.9rem;padding:0 0 0 22px}
  .flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:8px}
  .flow button{background:#fff;color:var(--ink);border:3px solid var(--c);font-weight:700;padding:8px 12px;min-height:48px;text-align:center}
  .flow button small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
  .flow .fa{color:#aaa;font-weight:900}
  .flow .fv{display:none}
  .loopnote{margin-top:12px;text-align:center;color:var(--muted)}
  @media (max-width:600px){
    .stage{padding:14px 12px}
    .flow{flex-direction:column}
    .flow button{width:100%;max-width:340px}
    .flow .fa{display:none}
    .flow .fv{display:block}
    .tl .row{flex-direction:column;align-items:flex-start;gap:4px}
  }

  /* 動畫（只設定「起點」，終點就是原本畫面，所以關閉動畫時直接顯示最終位置） */
  .fade{animation:fade .6s both}
  .pop{animation:pop .5s both;transform-box:fill-box;transform-origin:center}
  .vanish{opacity:0;animation:vanish .6s both}
  .hl{animation:pulse 1.2s ease-in-out infinite}
  .cur{transform:translate(var(--ex),var(--ey));animation:curmove 3.4s .3s ease-in-out both;pointer-events:none}
  .rip{fill:none;stroke:#ff6a00;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;animation:rip .6s forwards}
  .drag{opacity:0;animation:dragk 1.03s ease-in-out both}
  @keyframes fade{from{opacity:0}}
  @keyframes pop{from{opacity:0;transform:scale(.5)}}
  @keyframes vanish{from{opacity:1}}
  @keyframes pulse{50%{stroke-opacity:.25}}
  @keyframes curmove{0%,12%{transform:translate(var(--sx),var(--sy))}45%,58%{transform:translate(var(--mx),var(--my))}92%,100%{transform:translate(var(--ex),var(--ey))}}
  @keyframes rip{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}
  @keyframes dragk{from{transform:translate(var(--sx),var(--sy));opacity:1}90%{opacity:1}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<header>
  <a class="home" href="index.html">🏠 回總目錄</a>
  <h1>🖱️ osep_math 學生操作教學</h1>
</header>
<nav class="map" id="map" aria-label="操作分段"></nav>
<div class="bar"><i id="bar"></i></div>
<main>
  <section class="stage" id="stage" aria-live="polite"></section>
  <div class="controls">
    <button class="ghost" id="prev" aria-label="上一步">◀ 上一步</button>
    <span class="progress" id="progress"></span>
    <button id="next" aria-label="下一步">下一步 ▶</button>
    <button class="ghost" id="auto" aria-pressed="false">▶ 自動播放</button>
    <button class="ghost" id="replay" aria-label="重播這一步">↻ 重播</button>
  </div>
</main>
<footer><a href="index.html">🏠 回總目錄</a>｜鍵盤：← → 換步驟、空白鍵開關自動播放｜畫面是簡化的示意圖，實際畫面請以你的電腦為準</footer>

<script>
/* ---------- 小工具 ---------- */
const $ = id => document.getElementById(id);
const tw = (s, size) => { let w = 0; for (const ch of s) w += (ch.charCodeAt(0) > 255 ? 1 : .55) * size; return w; };
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 12}" fill="${o.fill || '#2b2d42'}"${o.w ? ` font-weight="${o.w}"` : ''}${o.anchor ? ` text-anchor="${o.anchor}"` : ''}${o.cls ? ` class="${o.cls}"` : ''}${o.style ? ` style="${o.style}"` : ''}>${s}</text>`;
const R = (x, y, w, h, fill, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx ?? 4}" fill="${fill}"${o.stroke ? ` stroke="${o.stroke}" stroke-width="${o.sw || 1}"` : ''}${o.cls ? ` class="${o.cls}"` : ''}${o.style ? ` style="${o.style}"` : ''}/>`;
const G = (cls, style, inner) => `<g${cls ? ` class="${cls}"` : ''}${style ? ` style="${style}"` : ''}>${inner}</g>`;
const BLK = (x, y, w, h, c, label, o = {}) => R(x, y, w, h, c, { stroke: 'rgba(0,0,0,.25)', rx: 5 }) + T(x + 8, y + h / 2 + 4.5, label, { fill: o.dark ? '#2b2d42' : '#fff', w: 700, size: 12.5 });
const SLOT = (x, y, w, t) => R(x, y, w, 18, '#fff', { rx: 9, stroke: '#999' }) + T(x + w / 2, y + 13, t, { anchor: 'middle', w: 700, size: 12 });
// 疊在畫面上的指示物
const hl = (x, y, w, h) => `<rect class="hl" x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="none" stroke="#ff6a00" stroke-width="3"/>`;
const tag = (x, y, s, o = {}) => { const sz = o.size || 13, w = tw(s, sz) + 16;
  return G(o.cls || '', o.style || '', `<rect x="${x}" y="${y}" width="${w}" height="22" rx="11" fill="${o.bg || '#d9480f'}"/><text x="${x + 8}" y="${y + 15.5}" font-size="${sz}" fill="#fff" font-weight="700">${s}</text>`); };
const arrow = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d9480f" stroke-width="3" marker-end="url(#ah)"/>`;
// 游標：pts 為 2 或 3 個點（起點→[中途點]→終點），到點時各按一下
function cursor(pts) {
  const three = pts.length === 3;
  const [s, m, e] = three ? pts : [pts[0], pts[1], pts[1]];
  const st = `--sx:${s[0]}px;--sy:${s[1]}px;--mx:${m[0]}px;--my:${m[1]}px;--ex:${e[0]}px;--ey:${e[1]}px`;
  const rip = (p, d) => `<circle class="rip" cx="${p[0]}" cy="${p[1]}" r="14" style="animation-delay:${d}s"/>`;
  return (three ? rip(m, 1.8) + rip(e, 3.4) : rip(e, 1.8)) +
    `<g class="cur" style="${st}"><path d="M0 0 L0 17 L4.5 13 L8 20.5 L11 19 L7.5 12.5 L13 12.5 Z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></g>`;
}
const T2 = 1.9, T3 = 3.5; // 游標按完後的時間點（2 點／3 點）

/* ---------- 編輯器示意圖的各個區塊 ---------- */
const CATS = [['動作', '#4c97ff'], ['外觀', '#9966ff'], ['聲音', '#cf63cf'], ['事件', '#ffbf00'], ['控制', '#ffab19'], ['感測', '#5cb1d6'], ['運算', '#59c059'], ['變數', '#ff8c1a']];
function browserBar() {
  return R(0, -34, 840, 34, '#e3e0d8', { rx: 0 }) + R(190, -28, 460, 22, '#fff', { rx: 11, stroke: '#bbb' }) + T(206, -12.5, '（老師給你的網址）', { size: 12, fill: '#666' });
}
function toolbar(o) {
  return R(0, 0, 840, 34, '#d94a3d', { rx: 0 }) + T(10, 22, 'osep_math', { fill: '#fff', w: 800, size: 14 }) +
    T(104, 22, '檔案', { fill: '#fff', size: 12 }) + T(144, 22, '編輯', { fill: '#fff', size: 12 }) +
    T(326, 22, '學生代號', { fill: '#fff', size: 12.5, w: 700 }) +
    R(392, 6, 110, 22, '#fff', { rx: 4 }) + T(400, 22, '（你的代號）', { size: 12, w: 700 }) +
    R(510, 6, 84, 22, '#ffe08a', { rx: 4, stroke: '#a77b00' }) + T(552, 22, '確認代號', { anchor: 'middle', size: 12.5, w: 700 }) +
    (o.confirmed ? T(602, 22, '✓ 已確認', { fill: '#fff', w: 700, size: 12.5, cls: 'pop', style: 'animation-delay:3.6s' }) : '');
}
function cats() {
  let s = R(0, 34, 44, 426, '#f4f4f8', { rx: 0 }) + R(0, 34 + 7 * 50, 44, 50, '#ffe2c2', { rx: 0 });
  CATS.forEach((c, i) => { const y = 34 + i * 50; s += `<circle cx="22" cy="${y + 20}" r="10" fill="${c[1]}"/>` + T(22, y + 42, c[0], { anchor: 'middle', size: 10.5 }); });
  return s;
}
function palette() {
  return R(44, 34, 124, 426, '#f9f9fc', { rx: 0, stroke: '#e3e3ec' }) + T(52, 54, '變數', { w: 700, size: 13 }) +
    R(52, 64, 50, 24, '#e6730a', { rx: 12 }) + T(77, 80, '清單', { anchor: 'middle', fill: '#fff', w: 700, size: 12 }) +
    BLK(52, 98, 112, 28, '#e6730a', '加入 □ 到 2的倍數') + BLK(52, 134, 112, 28, '#e6730a', '2的倍數 的長度') + BLK(52, 170, 112, 28, '#e6730a', '清空 2的倍數');
}
function codeArea(o) {
  const x = 186, two = o.extra === 'anim' || o.extra === 'snap', innerH = two ? 56 : 28;
  let s = R(168, 34, 286, 426, '#ffffff', { rx: 0, stroke: '#e3e3ec' });
  if (o.run) s += G('pop', 'animation-delay:1.9s', `<rect x="180" y="60" width="252" height="${innerH + 108}" rx="8" fill="rgba(255,212,0,.16)" stroke="#ffd400" stroke-width="4"/>`);
  s += BLK(x, 66, 150, 30, '#e0a800', '當綠旗被點擊', { dark: true }) + BLK(x, 96, 90, 28, '#9966ff', '隱藏');
  s += R(x, 124, 240, 28, '#e69500', { stroke: 'rgba(0,0,0,.25)', rx: 5 }) + T(x + 8, 143, '重複', { fill: '#fff', w: 700, size: 12.5 }) + SLOT(x + 40, 129, 32, '');
  s += o.numAnim ? T(x + 56, 142, '3', { anchor: 'middle', w: 700, size: 12, cls: 'vanish', style: 'animation-delay:2s' }) + T(x + 56, 142, '5', { anchor: 'middle', w: 700, size: 12, fill: '#d9480f', cls: 'pop', style: 'animation-delay:2s' })
    : T(x + 56, 142, '3', { anchor: 'middle', w: 700, size: 12 });
  s += T(x + 80, 143, '次', { fill: '#fff', w: 700, size: 12.5 });
  s += R(x, 152, 14, innerH, '#e69500', { rx: 0 }) + R(x, 152 + innerH, 240, 14, '#e69500', { rx: 5, stroke: 'rgba(0,0,0,.25)' });
  s += BLK(x + 14, 152, 226, 28, '#e6730a', '加入 (數) 到 10的倍數');
  if (o.extra === 'snap') s += BLK(x + 14, 180, 226, 28, '#e6730a', '加入 … 到 10的倍數的個位');
  if (o.extra === 'anim') s += G('fade', 'animation-delay:1.9s', BLK(x + 14, 180, 226, 28, '#e6730a', '加入 … 到 10的倍數的個位'));
  if (o.comment) s += R(186, 262, 254, 40, '#fff59d', { rx: 3, stroke: '#d9c000' }) + `<polygon points="196,262 206,262 200,254" fill="#d9c000"/>` +
    T(194, 278, o.comment[0], { w: 700, size: 12.5 }) + T(194, 294, o.comment[1], { size: 12 });
  return s;
}
function stageSvg(o) {
  let s = R(454, 34, 160, 426, '#f0f0f6', { rx: 0, stroke: '#e3e3ec' });
  s += `<path d="M468 46 v24" stroke="#2a9d8f" stroke-width="3"/><path d="M468 47 q8 -6 16 0 t16 0 v11 q-8 6 -16 0 t-16 0z" fill="#2fb36d"/>`;
  s += `<circle cx="526" cy="58" r="9" fill="#e5484d"/>`;
  s += R(454, 72, 160, 120, '#fff', { rx: 0, stroke: '#888' });
  const sp = `<circle cx="534" cy="128" r="22" fill="#f4a261" stroke="#c9792a" stroke-width="2"/><polygon points="516,112 520,92 530,106" fill="#f4a261" stroke="#c9792a" stroke-width="2"/><polygon points="552,112 548,92 538,106" fill="#f4a261" stroke="#c9792a" stroke-width="2"/><circle cx="526" cy="125" r="3" fill="#2b2d42"/><circle cx="542" cy="125" r="3" fill="#2b2d42"/><path d="M528 135 q6 5 12 0" stroke="#2b2d42" stroke-width="2" fill="none"/>`;
  if (o.sprite === 'vanish') s += G('vanish', 'animation-delay:2.2s', sp); else if (o.sprite !== 'none') s += sp;
  if (o.ask) {
    s += R(460, 124, 148, 32, '#fff', { rx: 10, stroke: '#999' }) + `<polygon points="478,156 488,156 480,164" fill="#fff" stroke="#999"/>` + R(479, 155, 10, 3, '#fff', { rx: 0 }) +
      T(468, 145, '請輸入一個數', { size: 12.5, w: 700 }) +
      R(460, 166, 126, 22, '#fff', { rx: 4, stroke: '#3a86ff', sw: 2 }) + T(468, 182, o.typed || '', { w: 700, size: 13 }) +
      `<circle cx="598" cy="177" r="10" fill="#3a86ff"/>` + T(598, 182, '✓', { anchor: 'middle', fill: '#fff', w: 800, size: 13 });
  }
  s += T(462, 240, '角色', { size: 11, fill: '#777', w: 700 }) + R(462, 246, 52, 52, '#fff', { rx: 6, stroke: '#3a86ff', sw: 2 });
  return s;
}
function chip(c) {
  const x = 630 + c.i * 46, y = 271 + c.r * 22;
  const body = R(x, y, 40, 18, c.fill || '#fff', { rx: 9, stroke: c.stroke || '#aaa', sw: c.sw || 1 }) + T(x + 20, y + 13, c.t, { anchor: 'middle', w: 700, size: 11.5 });
  return c.cls ? G(c.cls, c.style, body) : body;
}
function panel(o) {
  const X = 622;
  let s = R(X, 34, 218, 426, '#fffdf8', { rx: 0, stroke: '#d8cfc0' }) + R(X, 34, 218, 30, '#fff0c9', { rx: 0 });
  s += T(X + 10, 54, o.title || '學習面板', { w: 700, size: 13 });
  s += R(748, 38, 86, 22, '#7209b7', { rx: 11 }) + T(791, 53, '解題導師', { anchor: 'middle', fill: '#fff', size: 11.5, w: 700 });
  if (o.mode === 'select') {
    s += T(630, 84, '全部課程', { w: 700, size: 12 }) + R(630, 90, 202, 28, '#fff', { rx: 5, stroke: '#888' }) +
      T(640, 109, '②-1　2 的倍數', { size: 13 }) + T(816, 109, '▾', { size: 13, anchor: 'middle' });
    ['① 造例', '② 提出猜想', '③ 效化', '④ 一般化', '⑤ 證實'].forEach((n, i) => {
      const y = 128 + i * 44;
      if (i === 0) s += R(630, y, 202, 38, '#2bb3dd', { rx: 8 }) + T(642, y + 25, n, { fill: '#fff', w: 800, size: 14 });
      else s += R(630, y, 202, 38, '#e4e2dc', { rx: 8 }) + T(642, y + 17, n, { fill: '#777', w: 700, size: 13 }) + T(642, y + 32, '先完成前一個階段', { fill: '#777', size: 10.5 }) + T(814, y + 24, '🔒', { size: 14, anchor: 'middle' });
    });
    return s;
  }
  // 階段內：黃色提示條＋面板內容
  const h = o.hint;
  s += R(630, 70, 202, 80, '#fff0a8', { rx: 6, stroke: '#e0b400', sw: 1.5 }) + T(640, 88, h.n, { w: 700, size: 12, fill: '#6b4e00' }) +
    T(640, 105, h.b[0]) + T(640, 121, h.b[1]) + T(640, 141, '看全部步驟 ▾', { size: 11.5, fill: '#1b62c9' });
  if (h.btn) s += R(744, 126, 88, 20, '#2a9d8f', { rx: 10 }) + T(788, 140, '這步做好了', { anchor: 'middle', fill: '#fff', w: 700, size: 11.5 });
  if (o.warn) s += R(630, 156, 202, 42, '#fff', { rx: 5, stroke: '#d62828', sw: 2.5 }) + T(638, 172, '清單裡記到的內容不像這一步', { size: 11, fill: '#d62828', w: 700 }) + T(638, 188, '要的。檢查剛補上的那一塊', { size: 11, fill: '#d62828', w: 700 });
  // 下半部
  s += T(630, 209, '我的例子', { size: 11, w: 700, fill: '#555' }) + R(630, 214, 138, 24, '#fff', { rx: 4, stroke: '#999' }) +
    (o.inputRaw || T(638, 230, '寫下你的例子', { size: 11.5, fill: '#999' })) +

/* ---------- 播放控制 ---------- */
let idx = 0, timer = null;
const AUTO_MS = 9000;
function buildMap() {
  $('map').innerHTML = STATIONS.map((n, i) =>
    (i ? '<span class="arrow" aria-hidden="true">➜</span>' : '') +
    `<span class="station" tabindex="0" role="button" data-s="${i}" style="--c:${n[1]}">${n[0]}</span>`).join('');
  $('map').querySelectorAll('.station').forEach(el => {
    const go = () => { idx = SCENES.findIndex(sc => sc.st === +el.dataset.s); render(); };
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}
function render() {
  const sc = SCENES[idx];
  $('stage').innerHTML = head(`第 ${idx + 1} 步：${sc.t}`, sc.sub) + sc.html() + `<div class="caption fade">${sc.say}</div>`;
  $('stage').querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { idx = +b.dataset.go - 1; render(); }));
  document.querySelectorAll('.station').forEach(el => {
    const s = +el.dataset.s;
    el.classList.toggle('active', s === sc.st);
    el.classList.toggle('done', s < sc.st);
  });
  $('progress').textContent = `${idx + 1} / ${SCENES.length}`;
  $('bar').style.width = ((idx + 1) / SCENES.length * 100) + '%';
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === SCENES.length - 1;
  if (timer) schedule();
}
function go(d) { const n = idx + d; if (n >= 0 && n < SCENES.length) { idx = n; render(); } }
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(() => { if (idx < SCENES.length - 1) go(1); else setAuto(false); }, AUTO_MS);
}
function setAuto(on) {
  clearTimeout(timer); timer = on ? 1 : null;
  $('auto').textContent = on ? '⏸ 暫停' : '▶ 自動播放';
  $('auto').setAttribute('aria-pressed', on);
  if (on) { if (idx === SCENES.length - 1) { idx = 0; render(); } else schedule(); }
}
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('replay').onclick = () => render();
$('auto').onclick = () => setAuto(!timer);
document.addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('station')) return;
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); setAuto(!timer); }
});
// 可用 ?step=N 直接開到第 N 步
const q = parseInt(new URLSearchParams(location.search).get('step'), 10);
if (q >= 1 && q <= SCENES.length) idx = q - 1;
buildMap(); render();
</script>
