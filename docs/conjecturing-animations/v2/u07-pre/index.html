<style>
/* repo 轉教學動畫網頁｜通用骨架（黑板舞台）。新動畫只改「設定區」與「場景區」。 */
:root{
  --board:#23392f; --board-deep:#1a2b23; --frame:#6e4c31;
  --chalk:#efe9d8; --chalk-dim:#a9b3a6;
  --yellow:#f2c14e; --orange:#e8875b; --blue:#7fb6d9; --green:#8fd18a; --red:#e66a5c;
  --font-chalk:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --font-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--board-deep);color:var(--chalk)}
body{margin:0;font-family:var(--font-body)}
/* ===== 播放器版面公版（研習平台頁同一套規則）=====
   1) 播放區 .player（標題列＋舞台＋字幕＋控制列）剛好佔一個視窗高；章節、延伸閱讀、出處在下方，往下捲才看到。
   2) 舞台吃「扣掉標題列、字幕、控制列後的剩餘空間」：.stage-area 是容器查詢容器，.board 用 cqw／cqh 算出 16:9 最大尺寸並置中；
      木框寬度只用 --bw 變數計入（SVG 本身維持 16:9），不得再用固定像素去扣高度。
   3) 進度條列可收合（#toggleSeek），預設收起；收起時舞台自動變大。字幕至少預留兩行，段落切換時舞台不跳動。    4) 標註工具（手寫筆跡＋文字，.annoLayer 掛在 .board 內）：「標註工具 ▸／▾」（#toggleInk）收合一列工具列，預設收起；標註以段落為單位、只存在記憶體；?embed=1 不啟用。 */
.wrap{max-width:1600px;margin:0 auto;padding-inline:16px;padding-bottom:28px;display:flex;flex-direction:column;gap:14px}
.player{box-sizing:border-box;height:100vh;height:100dvh;padding-block:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.player>header,.player>.controls{flex:none}
.theater{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:10px;align-items:center}
.theater .caption{align-self:stretch;flex:none}
.stage-area{flex:1 1 0;min-height:0;align-self:stretch;display:flex;align-items:center;justify-content:center;container-type:size}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 16px}
h1{font-family:var(--font-chalk);font-weight:700;font-size:clamp(1.3rem,2.6vw,1.9rem);margin:0}
.sub{color:var(--chalk-dim);font-size:.95rem;margin:0}
.board{--bw:14px;box-sizing:border-box;border:var(--bw) solid var(--frame);border-radius:6px;background:var(--board);box-shadow:inset 0 0 60px rgba(0,0,0,.45);flex:none;max-width:100%;
  width:100%;width:min(100cqw, calc((100cqh - 2 * var(--bw)) * 16 / 9 + 2 * var(--bw)))}
/* 全螢幕：theater 本身就是全螢幕元素，沿用同一套規則（舞台吃剩餘空間、字幕預留兩行；字幕字級與行高用 vh／vw） */
.theater:fullscreen{background:var(--board-deep);gap:1.5vh;padding:2vh 2vw;box-sizing:border-box}
.theater:fullscreen .caption{text-align:center;font-size:min(2.4vw,3.2vh);line-height:1.4;min-height:2.8em;max-width:100%}
@media (max-width:640px){.board{--bw:8px}}
/* 內嵌（?embed=1）：只留舞台與字幕，尺寸全用 vh，播放由外層 postMessage 控制（版面公版不套用） */
html.embed body{padding:0;overflow:hidden}
html.embed header,html.embed .controls,html.embed .chapters,html.embed .works,html.embed .note{display:none}
html.embed .wrap{max-width:none;gap:0;padding:0}
html.embed .player,html.embed .stage-area{display:contents}
html.embed .stage-area{container-type:normal}
html.embed .theater{flex:none;gap:1vh}
html.embed .board{width:min(100%, calc(89vh * 16 / 9));border-width:1.4vh}
html.embed .caption{font-size:2.6vh;line-height:1.4;min-height:3.8vh;text-align:center;padding:0 1vh;margin:0}
.board svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.caption{font-family:var(--font-chalk);text-align:center;font-size:clamp(1.05rem,2.2vw,1.45rem);line-height:1.5;min-height:3em;margin:0}
.caption b{color:var(--yellow);font-weight:700}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
#fs{margin-left:auto}
button{font:inherit;font-size:.95rem;color:var(--chalk);background:transparent;border:1.5px solid var(--chalk-dim);border-radius:999px;padding:.4em 1em;cursor:pointer}
button:hover{border-color:var(--yellow);color:var(--yellow)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
#play{min-width:5.5em;border-color:var(--yellow);color:var(--yellow)}
#toggleSeek[aria-expanded="true"]{border-color:var(--yellow);color:var(--yellow)}
/* 進度條列：獨佔 .controls 的第二列；黃色 6px 粗軌道畫在 #seekMarks（細線＝段落分界），上面疊透明的 range 與 16px 圓拇指 */
.seekrow{display:flex;flex:1 0 100%;align-items:center;gap:12px}
.seekrow[hidden]{display:none}
#seekWrap{position:relative;flex:1 1 200px;min-width:120px;height:20px}
#scrub{position:relative;z-index:1;-webkit-appearance:none;appearance:none;display:block;width:100%;height:20px;padding:0;margin:0;border:0;border-radius:0;background:transparent;cursor:pointer}
#scrub::-webkit-slider-runnable-track{height:6px;background:transparent}
#scrub::-moz-range-track{height:6px;border:0;background:transparent}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-5px;border:2px solid var(--board-deep);border-radius:50%;background:var(--yellow)}
#scrub::-moz-range-thumb{box-sizing:border-box;width:16px;height:16px;border:2px solid var(--board-deep);border-radius:50%;background:var(--yellow)}
#seekMarks{position:absolute;left:8px;right:8px;top:7px;height:6px;border-radius:3px;overflow:hidden;background:var(--yellow);pointer-events:none}
#seekMarks i{position:absolute;top:0;bottom:0;width:1px;background:var(--board-deep)}
#time{flex:none;width:8.5em;text-align:right;font-variant-numeric:tabular-nums;color:var(--chalk-dim);font-size:.85rem}
/* 標註工具（手寫筆跡＋文字）：標註層蓋在舞台上，平常 pointer-events:none，只有畫筆／文字啟用時才攔截；?embed=1 不建立 */
.board{position:relative}
.annoLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;--u:1px}
.annoLayer canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;background:none;border-radius:0;aspect-ratio:auto;box-shadow:none}
.annoLayer canvas.on{pointer-events:auto;touch-action:none;cursor:crosshair}
.annoLayer canvas.on.text-mode{cursor:text}
.annoLabels{position:absolute;inset:0;pointer-events:none}
.annoLabel{position:absolute;transform:translateY(-50%);font-family:var(--font-chalk,serif);font-size:calc(34 * var(--u));font-weight:700;line-height:1.25;padding:calc(4 * var(--u)) calc(14 * var(--u));background:rgba(26,43,35,.82);border:calc(2 * var(--u)) solid;border-radius:calc(10 * var(--u));white-space:pre-wrap;max-width:56%;word-break:break-word}
.annoInput{position:absolute;transform:translateY(-50%);box-sizing:border-box;width:max(180px,32%);max-width:92%;font-family:var(--font-chalk,serif);font-size:max(16px,calc(30 * var(--u)));font-weight:700;pointer-events:auto;background:rgba(26,43,35,.95);border:2px dashed var(--yellow,#f2c14e);color:var(--chalk,#efe9d8)}
.annoInput[hidden]{display:none}
#toggleInk[aria-expanded="true"]{border-color:var(--yellow,#f2c14e);color:var(--yellow,#f2c14e)}
/* 工具列：獨佔 .controls 的一整列 */
.annoRow{display:flex;flex:1 0 100%;flex-wrap:wrap;align-items:center;gap:8px 10px}
.annoRow[hidden]{display:none}
.annoSwatches{display:inline-flex;align-items:center;gap:8px}
.annoSwatch{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid transparent}
.annoSwatch[aria-pressed="true"]{border-color:#fff;outline:2px solid var(--board-deep,var(--bg,#1a2b23))}
.annoRow button[aria-pressed="true"]:not(.annoSwatch){border-color:var(--yellow,#f2c14e);color:var(--board-deep,#1a2b23);background:var(--yellow,#f2c14e)}
.chapters{display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0;list-style:none}
.chapters button{font-size:.85rem;padding:.25em .8em;border-color:rgba(239,233,216,.25);color:var(--chalk-dim)}
.chapters button[aria-current="true"]{border-color:var(--yellow);color:var(--yellow)}
.note{color:var(--chalk-dim);font-size:.85rem;margin:0}
.works h2{font-family:var(--font-chalk);font-size:1.15rem;margin:0 0 6px;color:var(--yellow)}
.works ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 16px}
.works a{color:var(--chalk);text-underline-offset:3px}
.works span{display:block;color:var(--chalk-dim);font-size:.85rem}
.t-chalk{font-family:var(--font-chalk);fill:var(--chalk)}
.t-body{font-family:var(--font-body);fill:var(--chalk)}
</style>

<div class="wrap">
  <section class="player" aria-label="動畫播放器">
    <header>
      <h1 id="title"></h1>
      <p class="sub" id="subtitle"></p>
    </header>
    <div class="theater" id="theater">
      <div class="stage-area"><div class="board"><svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img"></svg></div></div>

  <ul class="chapters" id="chapters"></ul>

  <p class="note" id="note"></p>
</div>

<script>
'use strict';
// ===================== 設定區（段落與字幕由 timing.json 注入）=====================
// ===== 教學動畫共用圖形（不得與範本播放器或工具重名）=====
const C = { yellow: 'var(--yellow)', blue: 'var(--blue)', green: 'var(--green)', red: 'var(--red)', orange: 'var(--orange)', purple: '#b9a3e3', chalk: 'var(--chalk)', dim: 'var(--chalk-dim)', deep: 'var(--board-deep)' };
function arrow(x1, y1, x2, y2, color = C.dim, op = 1, both = false, k = 1, dash = '') {
  const ex = lerp(x1, x2, k), ey = lerp(y1, y2, k);
  const ang = Math.atan2(y2 - y1, x2 - x1), h = 16;
  const head = (x, y, a) => `<polygon points="${x},${y} ${x - h * Math.cos(a - 0.45)},${y - h * Math.sin(a - 0.45)} ${x - h * Math.cos(a + 0.45)},${y - h * Math.sin(a + 0.45)}" fill="${color}"/>`;
  let g = `<g opacity="${op}"><line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="${color}" stroke-width="4" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
  if (k >= 0.99) { g += head(x2, y2, ang); if (both) g += head(x1, y1, ang + Math.PI); }
  return g + '</g>';
}
// 曲線箭頭：二次貝茲，k 為繪製進度（以 dasharray 截斷）
function curve(x1, y1, cx, cy, x2, y2, color = C.dim, op = 1, k = 1, label = '', lx = 0, ly = 0) {
  const len = 1400;
  let g = `<g opacity="${op}"><path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="4" stroke-dasharray="10 9" pathLength="${len}" style="stroke-dashoffset:0"/>`;
  if (k < 0.99) g = `<g opacity="${op}"><path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}" fill="none" stroke="${color}" stroke-width="4" pathLength="${len}" stroke-dasharray="${(len * k).toFixed(1)} ${len}"/>`;
  else {
    const a = Math.atan2(y2 - cy, x2 - cx), h = 16;
    g += `<polygon points="${x2},${y2} ${x2 - h * Math.cos(a - 0.45)},${y2 - h * Math.sin(a - 0.45)} ${x2 - h * Math.cos(a + 0.45)},${y2 - h * Math.sin(a + 0.45)}" fill="${color}"/>`;
  }
  if (label) g += txt(lx, ly, label, { c: 't-body', s: 24, f: color, o: k >= 0.99 ? 1 : 0 });
  return g + '</g>';
}
function hframe(x, y, w, h, op, label = '', color = C.yellow, glow = 0, size = 32) {
  return `<g opacity="${op}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="26" fill="rgba(242,193,78,${0.04 + 0.08 * glow})" stroke="${color}" stroke-width="${4 + 2 * glow}" stroke-dasharray="16 12"/>` +
    (label ? txt(x + 26, y + 44, label, { s: size, w: 1, f: color }) : '') + '</g>';
}
function card(x, y, W, h, op, lines, color = C.chalk) {
  // lines: [[文字, 字級, 顏色, 粗體, 字型類別, 置中]]，依序往下排
  let g = `<g opacity="${op}">${box(x, y, W, h, color, 1, C.deep)}`;
  let yy = y + 14;
  for (const [s, size = 28, f = C.chalk, bold = false, c = 't-chalk', cx = false] of lines) {
    yy += size * 1.25;
    g += txt(cx ? x + W / 2 : x + 24, yy, s, { s: size, f, w: bold, c, a: cx ? 'middle' : 'start' });
    yy += size * 0.3;
  }
  return g + '</g>';
}
function ccard(x, y, w, h, op, title, sub, color = C.chalk, tsize = 32, ssize = 24) {
  return `<g opacity="${op}">${box(x, y, w, h, color, 1, C.deep)}` +
    txt(x + w / 2, y + h / 2 + (sub ? -6 : tsize * 0.35), title, { a: 'middle', s: tsize, w: 1, f: color }) +
    (sub ? txt(x + w / 2, y + h / 2 + ssize + 8, sub, { a: 'middle', c: 't-body', s: ssize, f: C.dim }) : '') + '</g>';
}
function chip(x, y, w, label, op, color = C.chalk, size = 26, h = 58) {
  return `<g opacity="${op}">${box(x, y, w, h, color, 1, C.deep)}${txt(x + w / 2, y + h / 2 + size * 0.36, label, { a: 'middle', s: size, f: color })}</g>`;
}
function tick(x, y, s, op, color = C.green) {
  return `<path d="M${x - s} ${y} L${x - s / 3} ${y + s * 0.7} L${x + s} ${y - s * 0.8}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`;
}
function cross(x, y, s, op, color = C.red) {
  return `<g opacity="${op}" stroke="${color}" stroke-width="12" stroke-linecap="round"><line x1="${x - s}" y1="${y - s}" x2="${x + s}" y2="${y + s}"/><line x1="${x + s}" y1="${y - s}" x2="${x - s}" y2="${y + s}"/></g>`;
}
function dot(x, y, r, color, op = 1) { return `<circle cx="${x}" cy="${y}" r="${r}" fill="${color}" opacity="${op}"/>`; }
function underline(x1, x2, y, k, color = C.yellow, op = 1) { return `<line x1="${x1}" y1="${y}" x2="${lerp(x1, x2, k)}" y2="${y}" stroke="${color}" stroke-width="4" opacity="${op}"/>`; }
// 依進度逐一出現：第 i 個元素在 t0 + i*step 開始、花 dur 秒
const stagger = (u, t0, i, step = 0.6, dur = 0.7) => ease(P(u, t0 + i * step, t0 + i * step + dur));

// U7 課前暖身動畫 v2：場景只讀段內時間 u；資料與畫面皆不取即時時間。
const META = {
  title: '第七單元課前暖身：我們怎麼自己發現規律？',
  subtitle: '13 段・159 秒｜可停在任一段',
  ariaLabel: '說明從造例、提出猜想、效化、一般化到證實的五個步驟；以珠子、猜想卡與反例呈現規律如何被檢驗，最後留下課堂任務。',
  note: '出處：臆測五階段教學設計稿（第七單元任務一教案、五階段教學流程收斂稿）與本系列舊版動畫。珠子、便利貼為視覺表徵；所有算式與判斷由程式計算。鍵盤：空白鍵播放／暫停，左右方向鍵切換段落，F 鍵全螢幕。畫面只由時間決定。',
  works: [],
};

const U7P_GROUPS = [
  { key: '甲', color: 'var(--yellow)', entries: [[1, 3], [3, 5], [5, 7]], claim: '答案都是 4 的倍數' },
  { key: '乙', color: 'var(--orange)', entries: [[1, 1], [3, 3], [5, 5]], claim: '奇數＋奇數＝偶數' },
  { key: '丙', color: 'var(--blue)', entries: [[11, 13], [25, 9]], claim: '答案的個位數字都是 4' },
  { key: '丁', color: 'var(--green)', entries: [[2, 4], [6, 8]], claim: '兩個數加起來都是偶數' },
];
const U7P_STEPS = ['造例', '提出猜想', '效化', '一般化', '證實'];
const U7P_HATCH = 'rgba(239,233,216,.32)';
const U7P_DOT_RADIUS = 24;
const U7P_DOT_GAP = 58;

const u7pK = (u, a, d) => ease(P(u, a, a + d));
const u7pEquation = (a, b) => String(a) + '＋' + String(b) + '＝' + String(a + b);
const u7pParity = (n) => n % 2 === 0 ? '偶數' : '奇數';
const u7pUnit = (n) => n % 10;
const u7pRemainderFour = (n) => n % 4;
function u7pBead(x, y, color, op = 1) {
  return dot(x, y, U7P_DOT_RADIUS, color, op);
}

function u7pPairDots(n, cx, cy, gap = U7P_DOT_GAP, op = 1, redPair = -1, includeOdd = true, reserveOddColumn = true) {
  const u7pPairs = Math.floor(n / 2);
  const u7pOdd = n % 2;
  const u7pCols = u7pPairs + ((includeOdd || reserveOddColumn) && u7pOdd ? 1 : 0);
  const u7pStart = cx - ((u7pCols - 1) * gap) / 2;
  let u7pMarkup = '';
  for (let u7pIndex = 0; u7pIndex < u7pPairs; u7pIndex++) {
    const u7pX = u7pStart + u7pIndex * gap;
    const u7pColor = u7pIndex === redPair ? C.red : C.chalk;
    u7pMarkup += u7pBead(u7pX, cy - gap / 2, u7pColor, op);
    u7pMarkup += u7pBead(u7pX, cy + gap / 2, u7pColor, op);
  }
  if (includeOdd && u7pOdd) {
    const u7pX = u7pStart + u7pPairs * gap;
    u7pMarkup += u7pBead(u7pX, cy, C.red, op);
  }
  return u7pMarkup;
}

function u7pPairStats(n, cx, y, op = 1) {
  return txt(cx, y, '對數：' + Math.floor(n / 2) + '　落單：' + (n % 2), {
    a: 'middle', c: 't-body', s: 24, f: C.dim, o: op,
  });
}

function u7pNumberPanel(n, cx, cy, label, op = 1) {
  let u7pMarkup = box(cx - 180, cy - 125, 360, 250, C.dim, op, 'rgba(0,0,0,.10)');
  u7pMarkup += txt(cx, cy - 72, label + '　' + n, { a: 'middle', s: 30, w: 1, o: op });
  u7pMarkup += u7pPairDots(n, cx, cy + 8, U7P_DOT_GAP, op);
  u7pMarkup += u7pPairStats(n, cx, cy + 105, op);
  return u7pMarkup;
}

function u7pSticky(x, y, w, h, group, claim, op = 1) {
  const u7pColor = U7P_GROUPS.find((u7pItem) => u7pItem.key === group).color;

  function applyUi() {

    toggle.setAttribute('aria-expanded', String(open));
    toggle.textContent = open ? '標註工具 ▾' : '標註工具 ▸';
    if (!open) setTool(null);
  }
  toggle.onclick = () => { open = !open; uiSet(open); applyUi(); };
  // 全螢幕下不放工具列；進入全螢幕時關閉畫筆，筆跡仍顯示（標註層在全螢幕元素內）
  document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) setTool(null); });
  // 換段時顯示該段的標註：包住 seek，不改變 seek 的畫面與回傳值
  const baseSeek = window.seek;
  window.seek = async function (t) {
    const r = await baseSeek.call(this, t);
    const i = segOf(Number(t) || 0);
    if (i !== seg) { seg = i; closeInput(); redraw(); renderLabels(); }
    return r;
  };
  new ResizeObserver(fit).observe(board || stageEl);
  applyUi(); fit();
})();
let cur = 0, playing = false, last = 0;
const chap = document.getElementById('chapters');
const btns = SEGS.map((s, i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.textContent = `${i + 1}・${s.name}`; b.onclick = () => { playerPause(); playerShow(s.a); };
  li.append(b); chap.append(li); return b;
});
function playerShow(t) {
  cur = clamp(t, 0, window.DURATION); scrub.value = cur;
  timeEl.textContent = `${cur.toFixed(1)} / ${window.DURATION.toFixed(1)}`;
  window.seek(cur);
  const i = segIndex(cur); btns.forEach((b, j) => b.setAttribute('aria-current', j === i ? 'true' : 'false'));
}
function playerTick(now) { if (!playing) return; cur += (now - last) / 1000; last = now; if (cur >= window.DURATION) { cur = window.DURATION; playerPause(); } playerShow(cur); if (playing) requestAnimationFrame(playerTick); }
function playerPlay() { if (cur >= window.DURATION - 0.05) cur = 0; playing = true; playBtn.textContent = '暫停'; last = performance.now(); requestAnimationFrame(playerTick); }
function playerPause() { playing = false; playBtn.textContent = '播放'; }
playBtn.onclick = () => (playing ? playerPause() : playerPlay());
scrub.oninput = () => { playerPause(); playerShow(Number(scrub.value)); };
document.getElementById('prev').onclick = () => { playerPause(); playerShow(SEGS[segIndex(cur - 0.6)].a); };
document.getElementById('next').onclick = () => { playerPause(); const i = segIndex(cur) + 1; playerShow(i < SEGS.length ? SEGS[i].a : window.DURATION); };
document.getElementById('fs').onclick = () => { const th = document.getElementById('theater'); document.fullscreenElement ? document.exitFullscreen() : th.requestFullscreen?.(); };
addEventListener('keydown', (e) => {
  if (document.documentElement.classList.contains('embed')) return;
  if (e.target.closest('input,button')) return;
  if (e.key === ' ') { e.preventDefault(); playing ? playerPause() : playerPlay(); }
  else if (e.key === 'ArrowRight') document.getElementById('next').click();
  else if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  else if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
});
window.ready.then(() => playerShow(cur));
// 研習平台嵌入契約（postMessage 握手，鍵名 ptt 為相容用）：被嵌入時才啟用
addEventListener('message', (e) => {
  if (e.source !== window.parent || window.parent === window) return;
  const m = e.data;
  if (!m || m.ptt !== 1 || m.type !== 'seek' || typeof m.t !== 'number' || !Number.isFinite(m.t)) return;
  window.seek(m.t);
});
if (window.parent !== window) window.ready.then(() => parent.postMessage({ ptt: 1, type: 'ready', duration: window.DURATION }, '*'));
</script>
